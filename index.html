<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Festa Junina 2026 🌽</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap');

    :root {
      --bg:        #1c0d00;
      --surface:   #2e1500;
      --card:      #3a1c00;
      --border:    #6b3a1f;
      --gold:      #f5c842;
      --gold-dim:  #c49a1a;
      --red:       #c0392b;
      --red-dim:   #8b1a0e;
      --green:     #2e7d5e;
      --text:      #f5e6cc;
      --text-dim:  #a07850;
      --progress-track: #4a2800;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Lato', 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: 80px;
    }

    /* ── BANDEIRINHAS ─────────────────────────────── */
    .flags-row {
      display: flex;
      align-items: flex-end;
      overflow: hidden;
      line-height: 0;
    }
    .flags-row svg { flex-shrink: 0; }

    /* ── HEADER ──────────────────────────────────── */
    header {
      background: var(--surface);
      border-bottom: 2px solid var(--border);
      overflow: hidden;
    }
    .header-inner {
      text-align: center;
      padding: 20px 16px 24px;
      position: relative;
    }
    .header-inner::before {
      content: '';
      position: absolute; inset: 0;
      background: repeating-linear-gradient(
        -45deg,
        transparent, transparent 12px,
        rgba(245,200,66,.04) 12px, rgba(245,200,66,.04) 13px
      );
      pointer-events: none;
    }
    .header-emoji { font-size: 44px; line-height: 1; margin-bottom: 10px; }
    header h1 {
      font-family: Georgia, 'Times New Roman', serif;
      font-size: clamp(26px, 6vw, 36px);
      font-weight: 700;
      color: var(--gold);
      letter-spacing: 2px;
      text-transform: uppercase;
      text-shadow: 0 2px 16px rgba(245,200,66,.4);
      margin-bottom: 4px;
    }
    header p {
      color: var(--text-dim);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    /* ── CONTAINER ───────────────────────────────── */
    .container { max-width: 560px; margin: 0 auto; padding: 0 14px; }

    /* ── TOAST ───────────────────────────────────── */
    .toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      background: var(--green); color: #fff;
      padding: 12px 28px; border-radius: 99px;
      font-size: 15px; font-weight: 700;
      box-shadow: 0 4px 24px rgba(0,0,0,.5);
      z-index: 100; white-space: nowrap;
      opacity: 0; transition: opacity .3s;
      pointer-events: none;
    }
    .toast.show { opacity: 1; }

    /* ── BTN PRINCIPAL ───────────────────────────── */
    #btn-area { text-align: center; padding: 28px 0 8px; }
    .btn-main {
      display: inline-flex; align-items: center; gap: 10px;
      background: var(--red);
      color: #fff; border: none; border-radius: 12px;
      padding: 16px 36px; font-size: 18px; font-weight: 900;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(192,57,43,.45), inset 0 1px 0 rgba(255,255,255,.15);
      transition: background .15s, transform .1s;
      letter-spacing: .3px;
    }
    .btn-main:hover { background: #a93226; }
    .btn-main:active { transform: scale(.97); }
    .btn-hint { color: var(--text-dim); font-size: 12px; margin-top: 8px; }

    /* ── FORMULÁRIO ──────────────────────────────── */
    .form-card {
      background: var(--card);
      border: 1.5px solid var(--border);
      border-radius: 16px; padding: 22px;
      margin: 20px 0 0;
      display: none;
    }
    .form-card.open { display: block; }
    .form-card h2 {
      font-size: 17px; font-weight: 900; color: var(--gold);
      margin-bottom: 18px; display: flex; align-items: center; gap: 8px;
    }

    .field { margin-bottom: 16px; }
    .field label {
      display: block; font-weight: 700; font-size: 12px;
      color: var(--text-dim); margin-bottom: 6px;
      text-transform: uppercase; letter-spacing: .8px;
    }
    .field input, .field select {
      width: 100%; padding: 11px 14px;
      background: var(--surface); border: 1.5px solid var(--border);
      border-radius: 9px; font-size: 15px; color: var(--text);
      outline: none; transition: border-color .15s;
      appearance: none;
    }
    .field input:focus, .field select:focus { border-color: var(--gold); }
    .field input::placeholder { color: var(--text-dim); }

    .qty-row { display: flex; gap: 8px; align-items: center; }
    .qty-row input {
      width: 80px; text-align: center;
      font-size: 20px; font-weight: 900;
    }
    .qty-btn {
      width: 42px; height: 42px; border: 1.5px solid var(--border);
      background: var(--surface); color: var(--gold);
      border-radius: 8px; font-size: 20px; font-weight: 700;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: background .1s;
    }
    .qty-btn:hover { background: var(--border); }

    .form-actions { display: flex; gap: 10px; margin-top: 20px; }
    .btn-cancel {
      flex: 1; padding: 13px;
      background: transparent; border: 1.5px solid var(--border);
      border-radius: 10px; font-size: 15px; font-weight: 700;
      color: var(--text-dim); cursor: pointer;
      transition: border-color .15s;
    }
    .btn-cancel:hover { border-color: var(--text-dim); }
    .btn-confirm {
      flex: 2; padding: 13px;
      background: var(--red); color: #fff;
      border: none; border-radius: 10px;
      font-size: 15px; font-weight: 900; cursor: pointer;
      box-shadow: 0 2px 12px rgba(192,57,43,.4);
      transition: background .15s;
    }
    .btn-confirm:hover { background: #a93226; }
    .btn-confirm:disabled { background: var(--border); box-shadow: none; cursor: not-allowed; }

    /* ── SEÇÃO TITLE ─────────────────────────────── */
    .section-title {
      font-size: 11px; font-weight: 900; color: var(--text-dim);
      text-transform: uppercase; letter-spacing: 2px;
      margin: 32px 0 14px;
      display: flex; align-items: center; gap: 10px;
    }
    .section-title::after {
      content: ''; flex: 1; height: 1px; background: var(--border);
    }

    /* ── ITEM CARDS ──────────────────────────────── */
    .item-card {
      background: var(--card);
      border: 1.5px solid var(--border);
      border-radius: 13px; padding: 14px 16px;
      margin-bottom: 8px; cursor: pointer;
      transition: border-color .15s, background .15s;
      user-select: none;
    }
    .item-card:hover { border-color: var(--gold-dim); background: #421e00; }
    .item-card.expanded { border-color: var(--gold); background: #421e00; }

    .item-top {
      display: flex; justify-content: space-between; align-items: center; gap: 10px;
    }
    .item-left { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .item-nome {
      font-weight: 700; font-size: 15px; color: var(--text);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .chevron {
      color: var(--text-dim); font-size: 12px;
      transition: transform .2s; flex-shrink: 0;
    }
    .item-card.expanded .chevron { transform: rotate(180deg); }

    .item-badge {
      display: flex; align-items: center; gap: 4px; flex-shrink: 0;
      background: var(--progress-track);
      border: 1px solid var(--border);
      border-radius: 99px; padding: 3px 11px;
      font-size: 13px; font-weight: 900; color: var(--text-dim);
      white-space: nowrap;
    }
    .item-badge.has-qty { background: var(--red-dim); border-color: var(--red); color: #fff; }

    /* ── PROGRESS ─────────────────────────────────── */
    .progress-wrap { margin-top: 10px; }
    .progress-labels {
      display: flex; justify-content: space-between;
      font-size: 11px; color: var(--text-dim); margin-bottom: 5px;
    }
    .progress-pct { font-weight: 900; }
    .progress-track-el {
      background: var(--progress-track); border-radius: 99px; height: 7px; overflow: hidden;
    }
    .progress-fill { height: 100%; border-radius: 99px; transition: width .5s ease; }

    /* ── CONTRIBUIÇÕES INLINE ─────────────────────── */
    .contrib-list {
      margin-top: 12px; border-top: 1px solid var(--border);
      padding-top: 12px; display: none;
    }
    .item-card.expanded .contrib-list { display: block; }

    .contrib-empty {
      text-align: center; color: var(--text-dim);
      font-size: 13px; padding: 8px 0 4px;
    }

    .contrib-row {
      display: flex; justify-content: space-between; align-items: flex-start;
      padding: 8px 0; border-bottom: 1px solid rgba(107,58,31,.4);
    }
    .contrib-row:last-child { border-bottom: none; }
    .contrib-info { flex: 1; min-width: 0; }
    .contrib-nome { font-weight: 700; font-size: 13px; color: var(--text); }
    .contrib-detalhe { font-size: 12px; color: var(--text-dim); margin-top: 1px; }
    .contrib-qty {
      font-size: 13px; font-weight: 900; color: var(--gold);
      white-space: nowrap; margin-left: 12px; flex-shrink: 0;
    }
    .btn-del {
      background: none; border: none; color: var(--border);
      font-size: 18px; cursor: pointer; padding: 0 0 0 10px;
      line-height: 1; flex-shrink: 0; transition: color .15s;
    }
    .btn-del:hover { color: var(--red); }

    /* ── EMPTY STATE ─────────────────────────────── */
    #empty-state {
      text-align: center; padding: 40px 20px;
      color: var(--text-dim); display: none;
    }
    #empty-state .big { font-size: 48px; margin-bottom: 12px; }
    #empty-state p { font-size: 15px; line-height: 1.5; }

    /* ── FOOTER ──────────────────────────────────── */
    .footer {
      text-align: center; font-size: 11px; color: var(--border);
      margin-top: 32px; letter-spacing: .5px;
    }

    /* ── LOADING ─────────────────────────────────── */
    .loading { text-align: center; color: var(--text-dim); padding: 24px; font-size: 14px; }

    /* ── SELECT ARROW CUSTOM ─────────────────────── */
    .select-wrap { position: relative; }
    .select-wrap::after {
      content: '▾'; position: absolute; right: 14px; top: 50%;
      transform: translateY(-50%); color: var(--text-dim);
      pointer-events: none; font-size: 14px;
    }
    .select-wrap select { padding-right: 32px; }
  </style>
</head>
<body>

<!-- BANDEIRINHAS SVG -->
<svg id="flags-svg-top" style="display:block;width:100%;height:40px" preserveAspectRatio="none" viewBox="0 0 560 40" xmlns="http://www.w3.org/2000/svg"></svg>

<header>
  <div class="header-inner">
    <div class="header-emoji">🌽🎪🪗</div>
    <h1>Festa Junina 2026</h1>
    <p>Lista Comunitária de Contribuições</p>
  </div>
</header>

<svg id="flags-svg-bottom" style="display:block;width:100%;height:40px;background:var(--surface)" preserveAspectRatio="none" viewBox="0 0 560 40" xmlns="http://www.w3.org/2000/svg"></svg>

<div class="toast" id="toast">🎉 Registrado! Obrigado!</div>

<div class="container">

  <!-- Botão principal -->
  <div id="btn-area">
    <button class="btn-main" onclick="openForm()">
      <span>✋</span> Eu vou levar algo!
    </button>
    <p class="btn-hint">Toque para registrar sua contribuição</p>
  </div>

  <!-- Formulário -->
  <div class="form-card" id="form-card">
    <h2>📝 O que você vai levar?</h2>

    <div class="field">
      <label>Seu nome *</label>
      <input id="f-nome" type="text" placeholder="Ex: Maria, João…" autocomplete="off" />
    </div>

    <div class="field">
      <label>Item *</label>
      <div class="select-wrap">
        <select id="f-item" onchange="onItemChange()"></select>
      </div>
    </div>

    <div class="field" id="campo-outro" style="display:none">
      <label>Qual item?</label>
      <input id="f-outro" type="text" placeholder="Ex: Bolo de fubá…" />
    </div>

    <div class="field">
      <label id="label-qtd">Quantidade *</label>
      <div class="qty-row">
        <button class="qty-btn" onclick="changeQty(-1)">−</button>
        <input id="f-qtd" type="number" min="1" value="1" />
        <button class="qty-btn" onclick="changeQty(1)">+</button>
      </div>
    </div>

    <div class="field">
      <label>Observação (opcional)</label>
      <input id="f-obs" type="text" placeholder="Ex: sem açúcar, tamanho grande…" />
    </div>

    <div class="form-actions">
      <button class="btn-cancel" onclick="closeForm()">Cancelar</button>
      <button class="btn-confirm" id="btn-confirm" onclick="submitForm()">✅ Confirmar</button>
    </div>
  </div>

  <!-- Resumo -->
  <p class="section-title">📊 O que já temos</p>
  <div id="resumo"><div class="loading">Carregando…</div></div>

  <div id="empty-state">
    <div class="big">🌽</div>
    <p>Ninguém registrou ainda.<br>Seja o primeiro!</p>
  </div>

  <p class="footer">🎪 Dados salvos na planilha do Google</p>
</div>

<script>
  // ── Estado ────────────────────────────────────────
  let contributions = [];
  let expandedId = null;

  // ── Bandeirinhas SVG ──────────────────────────────
  function buildFlags(svgId, flip) {
    const svg = document.getElementById(svgId);
    const colors = ["#c0392b","#f5c842","#2e7d5e","#e67e22","#c0392b","#f5c842","#2e7d5e","#e67e22","#c0392b","#f5c842","#2e7d5e","#e67e22","#c0392b","#f5c842"];
    const W = 40, gap = 2, n = 14;
    let html = '';
    // rope line
    html += `<line x1="0" y1="4" x2="560" y2="4" stroke="#6b3a1f" stroke-width="1.5"/>`;
    for (let i = 0; i < n; i++) {
      const x = i * (W + gap);
      const py = flip ? 40 : 4;
      const ty = flip ? 4 : 40;
      html += `<polygon points="${x},${py} ${x+W},${py} ${x+W/2},${ty}" fill="${colors[i]}" opacity=".92"/>`;
    }
    svg.innerHTML = html;
  }

  // ── Select ────────────────────────────────────────
  function buildSelect() {
    const sel = document.getElementById("f-item");
    ITENS.forEach(item => {
      const opt = document.createElement("option");
      opt.value = item.id;
      opt.textContent = item.nome;
      sel.appendChild(opt);
    });
  }

  function onItemChange() {
    const id = document.getElementById("f-item").value;
    const item = ITENS.find(i => i.id === id);
    document.getElementById("campo-outro").style.display = id === "outro" ? "block" : "none";
    document.getElementById("label-qtd").textContent = `Quantidade (${item.unidade}) *`;
  }

  // ── Form ──────────────────────────────────────────
  function openForm() {
    document.getElementById("form-card").classList.add("open");
    document.getElementById("btn-area").style.display = "none";
    onItemChange();
    setTimeout(() => document.getElementById("f-nome").focus(), 50);
  }
  function closeForm() {
    document.getElementById("form-card").classList.remove("open");
    document.getElementById("btn-area").style.display = "block";
    ["f-nome","f-outro","f-obs"].forEach(id => document.getElementById(id).value = "");
    document.getElementById("f-item").value = ITENS[0].id;
    document.getElementById("f-qtd").value = 1;
    document.getElementById("campo-outro").style.display = "none";
    onItemChange();
  }
  function changeQty(d) {
    const el = document.getElementById("f-qtd");
    el.value = Math.max(1, parseInt(el.value || 1) + d);
  }

  async function submitForm() {
    const nome   = document.getElementById("f-nome").value.trim();
    const itemId = document.getElementById("f-item").value;
    const item   = ITENS.find(i => i.id === itemId);
    const nomeItem = itemId === "outro"
      ? (document.getElementById("f-outro").value.trim() || "Outro")
      : item.nome;
    const qtd = parseInt(document.getElementById("f-qtd").value) || 1;
    const obs = document.getElementById("f-obs").value.trim();

    if (!nome) { alert("Coloca seu nome! 😊"); return; }

    const btn = document.getElementById("btn-confirm");
    btn.disabled = true; btn.textContent = "Salvando…";

    try {
      const res = await fetch(API_URL, {
        method: "POST",
        body: JSON.stringify({ action:"add", nome, item:nomeItem, itemId, qtd, unidade:item.unidade, obs })
      });
      const data = await res.json();
      if (data.success) {
        closeForm();
        toast("🎉 Registrado! Obrigado pela contribuição!");
        expandedId = itemId;
        await loadData();
      } else {
        alert("Erro ao salvar. Tenta de novo!");
      }
    } catch { alert("Erro de conexão. Verifica a internet."); }

    btn.disabled = false; btn.textContent = "✅ Confirmar";
  }

  // ── Toast ─────────────────────────────────────────
  function toast(msg) {
    const el = document.getElementById("toast");
    el.textContent = msg;
    el.classList.add("show");
    setTimeout(() => el.classList.remove("show"), 3000);
  }

  // ── Load ──────────────────────────────────────────
  async function loadData() {
    try {
      const res = await fetch(`${API_URL}?action=list`);
      contributions = await res.json();
      if (!Array.isArray(contributions)) contributions = [];
    } catch { contributions = []; }
    renderAll();
  }

  // Resolve itemId de uma contribuição — casa pelo id ou pelo nome (fallback entradas antigas)
  function resolveItemId(c) {
    if (c.itemId && c.itemId !== c.item) return c.itemId;
    const byName = ITENS.find(i => i.nome === c.item);
    return byName ? byName.id : "outro";
  }

  // ── Render ────────────────────────────────────────
  function renderAll() {
    const wrap = document.getElementById("resumo");
    const empty = document.getElementById("empty-state");

    // totais
    const totais = {};
    ITENS.forEach(i => totais[i.id] = 0);
    contributions.forEach(c => {
      const key = resolveItemId(c);
      totais[key] = (totais[key] || 0) + Number(c.qtd);
    });

    const hasAny = contributions.length > 0;
    empty.style.display = hasAny ? "none" : "block";

    wrap.innerHTML = ITENS.map(item => {
      const total    = totais[item.id] || 0;
      const hasMeta  = item.meta !== null;
      const pct      = hasMeta ? Math.min(100, Math.round(total / item.meta * 100)) : 0;
      const pctColor = pct >= 100 ? "#2e7d5e" : pct >= 60 ? "#e67e22" : "#c0392b";
      const isExp    = expandedId === item.id;

      const contribs = contributions.filter(c => resolveItemId(c) === item.id);

      const progressHTML = hasMeta ? `
        <div class="progress-wrap">
          <div class="progress-labels">
            <span>${total} / ${item.meta} ${item.unidade}${pct >= 100 ? " ✅" : ""}</span>
            <span class="progress-pct" style="color:${pctColor}">${pct}%</span>
          </div>
          <div class="progress-track-el">
            <div class="progress-fill" style="width:${pct}%;background:${pctColor}"></div>
          </div>
        </div>` : `<div style="margin-top:4px;font-size:11px;color:var(--text-dim)">${total} ${item.unidade} registrado${total !== 1 ? "s" : ""}</div>`;

      const contribRows = contribs.length === 0
        ? `<div class="contrib-empty">Ninguém registrou ainda</div>`
        : contribs.map(c => `
          <div class="contrib-row">
            <div class="contrib-info">
              <div class="contrib-nome">${esc(c.nome)}</div>
              ${c.obs ? `<div class="contrib-detalhe">📝 ${esc(c.obs)} · ${esc(c.hora)}</div>` : `<div class="contrib-detalhe">${esc(c.hora)}</div>`}
            </div>
            <div class="contrib-qty">${c.qtd} ${esc(c.unidade)}</div>
            <button class="btn-del" onclick="event.stopPropagation();removeContrib('${c.id}')" title="Remover">×</button>
          </div>`).join("");

      return `
        <div class="item-card${isExp ? " expanded" : ""}" onclick="toggleExpand('${item.id}')">
          <div class="item-top">
            <div class="item-left">
              <span class="chevron">▼</span>
              <span class="item-nome">${esc(item.nome)}</span>
            </div>
            <span class="item-badge${total > 0 ? " has-qty" : ""}">${total} ${item.unidade}</span>
          </div>
          ${progressHTML}
          <div class="contrib-list">
            ${contribRows}
          </div>
        </div>`;
    }).join("");
  }

  function toggleExpand(id) {
    expandedId = expandedId === id ? null : id;
    renderAll();
    if (expandedId) {
      setTimeout(() => {
        const cards = document.querySelectorAll(".item-card");
        for (const c of cards) {
          if (c.classList.contains("expanded")) {
            c.scrollIntoView({ behavior: "smooth", block: "nearest" });
            break;
          }
        }
      }, 50);
    }
  }

  async function removeContrib(id) {
    const senha = prompt("Digite a senha para remover:");
    if (senha === null) return;
    if (senha !== "festajunina") { alert("Senha incorreta! ❌"); return; }
    try {
      const res = await fetch(`${API_URL}?action=delete&id=${id}`);
      const data = await res.json();
      if (data.success) await loadData();
      else alert("Erro ao remover.");
    } catch { alert("Erro de conexão."); }
  }

  function esc(str) {
    return String(str ?? "")
      .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  }

  // ── Init ──────────────────────────────────────────
  buildFlags("flags-svg-top", false);
  buildFlags("flags-svg-bottom", true);
  buildSelect();
  loadData();
</script>
</body>
</html>
